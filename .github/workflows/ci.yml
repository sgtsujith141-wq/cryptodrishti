name: CI

on:
  push:
    # Development branches are verified on push. Without this the SIH
    # milestone branch had no CI at all until it was merged, which is the one
    # moment a regression is most expensive to discover.
    branches: [main, 'sih/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the test suite
        run: pytest

  smoke:
    name: CLI scan and CBOM conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scan this repository and emit a CBOM
        run: python -m app.cli scan app --cbom cbom.json

      - name: Assert the CBOM is a conforming CycloneDX 1.6 document
        run: |
          python - <<'PY'
          import json, sys
          from app import cbom

          doc = json.load(open("cbom.json"))
          assert doc["bomFormat"] == "CycloneDX", doc.get("bomFormat")
          assert doc["specVersion"] == "1.6", doc.get("specVersion")

          valid, problems = cbom.validate(doc)
          if not valid:
              print("CBOM failed structural validation:", *problems, sep="\n  ")
              sys.exit(1)
          print(f"CBOM OK: {len(doc['components'])} components, CycloneDX 1.6")
          PY

      - name: Scan a generated container image and emit a CBOM
        run: |
          python - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, "tests")
          import imagelab as L
          from app import cbom, orchestrator

          out = pathlib.Path("ci-image")
          builder = L.OCIBuilder()
          layer = L.tar_bytes([
              ("app/main.py", L.CRYPTO_APP_PY),
              ("app/requirements.txt", L.REQUIREMENTS),
              ("etc/nginx.conf", L.NGINX_CONF),
          ], gzipped=True)
          builder.add_image([layer], tag="ci:latest")
          archive = builder.write_tar(out / "ci.tar")

          result = orchestrator.scan_image(archive)
          doc = cbom.build(result)
          valid, problems = cbom.validate(doc)
          if not valid:
              print("container CBOM failed validation:", *problems, sep="\n  ")
              sys.exit(1)
          if not result.findings:
              print("container scan produced no findings")
              sys.exit(1)
          pathlib.Path("container-cbom.json").write_text(json.dumps(doc, indent=2))
          print(f"container CBOM OK: {len(doc['components'])} components "
                f"from {result.stats['container_layers']} layer(s)")
          PY

      - name: Upload the CBOMs
        uses: actions/upload-artifact@v4
        with:
          name: cbom
          path: |
            cbom.json
            container-cbom.json
