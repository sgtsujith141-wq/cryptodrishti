name: CI

on:
  push:
    # Development branches are verified on push. Without this the SIH
    # milestone branch had no CI at all until it was merged, which is the one
    # moment a regression is most expensive to discover.
    branches: [main, 'sih/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the test suite
        run: pytest

  smoke:
    name: CLI scan and CBOM conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scan this repository and emit a CBOM
        run: python -m app.cli scan app --cbom cbom.json

      - name: Validate the CBOM against the official CycloneDX schema
        run: |
          python - <<'PY'
          import json, sys
          from app import cbom, schema_validation

          doc = json.load(open("cbom.json"))
          assert doc["bomFormat"] == "CycloneDX", doc.get("bomFormat")
          assert doc["specVersion"] == "1.6", doc.get("specVersion")

          failed = False

          valid, problems = cbom.validate(doc)
          if not valid:
              print("CBOM failed structural validation:", *problems, sep="\n  ")
              failed = True

          # The official schema is the one that decides conformance. If it
          # cannot run, that is a CI failure too -- a check that silently did
          # not happen is worse than one that failed.
          if not schema_validation.available():
              print("official schema validation unavailable:",
                    schema_validation.unavailable_reason())
              sys.exit(1)

          drift = schema_validation.verify_checksums()
          if drift:
              print("vendored schemas have drifted:", *drift, sep="\n  ")
              sys.exit(1)

          ok, schema_problems = schema_validation.validate(doc, "1.6")
          if not ok:
              print("CBOM failed OFFICIAL CycloneDX 1.6 schema validation:",
                    *schema_problems[:40], sep="\n  ")
              failed = True

          if failed:
              sys.exit(1)
          print(f"CBOM OK: {len(doc['components'])} components, "
                f"official CycloneDX 1.6 schema validation passed")
          PY

      - name: Scan a generated container image and emit a CBOM
        run: |
          python - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, "tests")
          import imagelab as L
          from app import cbom, orchestrator

          out = pathlib.Path("ci-image")
          builder = L.OCIBuilder()
          layer = L.tar_bytes([
              ("app/main.py", L.CRYPTO_APP_PY),
              ("app/requirements.txt", L.REQUIREMENTS),
              ("etc/nginx.conf", L.NGINX_CONF),
          ], gzipped=True)
          builder.add_image([layer], tag="ci:latest")
          archive = builder.write_tar(out / "ci.tar")

          result = orchestrator.scan_image(archive)
          if not result.findings:
              print("container scan produced no findings")
              sys.exit(1)

          from app import schema_validation
          if not schema_validation.available():
              print("official schema validation unavailable:",
                    schema_validation.unavailable_reason())
              sys.exit(1)

          failed = False
          # Both supported spec versions are validated against their own
          # official schema. A version this tool offers but cannot produce
          # validly is worse than one it does not offer.
          for version in cbom.SUPPORTED_SPEC_VERSIONS:
              doc = cbom.build(result, spec_version=version)
              valid, problems = cbom.validate(doc)
              if not valid:
                  print(f"container CBOM {version} failed structural validation:",
                        *problems[:20], sep="\n  ")
                  failed = True
              ok, schema_problems = schema_validation.validate(doc, version)
              if not ok:
                  print(f"container CBOM {version} failed OFFICIAL schema validation:",
                        *schema_problems[:40], sep="\n  ")
                  failed = True
              else:
                  print(f"container CBOM OK: {len(doc['components'])} components, "
                        f"official CycloneDX {version} schema validation passed")
              pathlib.Path(f"container-cbom-{version}.json").write_text(
                  json.dumps(doc, indent=2))

          if failed:
              sys.exit(1)
          PY

      - name: Upload the CBOMs
        uses: actions/upload-artifact@v4
        with:
          name: cbom
          path: |
            cbom.json
            container-cbom-*.json
